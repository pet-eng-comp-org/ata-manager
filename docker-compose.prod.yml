# PRODUCAO — este arquivo e a stack `atamanager` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda. Ou seja: **mexer aqui implanta**. A linha `image:` quem escreve e o CI,
# a cada push no main (job `implanta` em publica-imagem.yml).
#
# As variaveis `$SPREADSHEET_ID` etc. sao referencias: os valores vivem na stack,
# dentro do Portainer. As credenciais do Google (credentials.json, token.json)
# ficam em /opt/ata-manager/credentials na VM e entram por volume: nao estao na
# imagem nem no git.

services:
  atamanager:
    # ghcr.io/pet-eng-comp-org/ata-manager:sha-29af687d0a0e698224d2e3a180485687a76389e7
    image: ghcr.io/pet-eng-comp-org/ata-manager@sha256:9ce2958fbb4b7401049658287e9a3c5984ee25b96008921d7aca6a77837cc151
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    environment:
      SPREADSHEET_ID: $SPREADSHEET_ID
      ATA_MAIN_FOLDER_ID: $ATA_MAIN_FOLDER_ID
      SENDER_MAIL: $SENDER_MAIL
      APP_PASSWORD: $APP_PASSWORD
      SHARED_DRIVE_ID: $SHARED_DRIVE_ID
      PYTHONUNBUFFERED: 1
    volumes:
      - /opt/ata-manager/credentials:/ata-manager/src/credentials
