name: Publica imagem no GHCR

# Constroi e publica a imagem a cada push no main. A tag e o hash do commit,
# para que sempre se saiba qual codigo esta rodando — antes disto, a imagem em
# producao nao declarava de qual commit veio.
#
# Implanta sozinho: o job `implanta` escreve o digest novo no
# docker-compose.prod.yml, e o Portainer aplica em ate 5 minutos.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Nenhum PAT envolvido: o GITHUB_TOKEN e gerado a cada execucao e expira
    # ao final dela.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
          # Grava a origem na propria imagem. Permite descobrir o commit a
          # partir do container em producao, sem depender de memoria.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publicar nao e implantar: quem implanta e o commit abaixo, que o Portainer
  # acompanha. So implanta se o codigo mudou: README e documentacao nao
  # reiniciam o bot. `git revert` no commit de deploy volta a versao anterior; o
  # push feito com GITHUB_TOKEN nao dispara este workflow de novo.
  implanta:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: implanta
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escreve o digest novo no compose de producao
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Execucao antiga nao implanta por cima de uma mais nova: se entrou
          # commit de codigo depois deste (os do bot nao contam), a execucao
          # dele implanta.
          novo=$(git log -1 --format=%H --invert-grep --grep='^deploy:' "${GITHUB_SHA}..HEAD")
          if [ -n "$novo" ]; then
            echo "Ha commit mais novo ($novo); a execucao dele implanta."; exit 0
          fi

          mudou=""
          for servico in bot; do
            img="ghcr.io/${GITHUB_REPOSITORY,,}"
            # Compara com o commit que esta EM PRODUCAO (o :sha- anotado no
            # compose), nao com o push anterior: deploy que falhou ou foi
            # cancelado entra na proxima execucao em vez de se perder.
            ultimo=$(grep -oE "${img}:sha-[0-9a-f]+" docker-compose.prod.yml | head -1 | sed 's/.*:sha-//' || true)
            if [ "$EVENTO" = push ] && [ -n "$ultimo" ] && git cat-file -e "${ultimo}^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$ultimo" "$GITHUB_SHA" | awk '!/^(README|LICENSE|docker-compose\.prod\.yml$|\.github\/|documentation\/)/ || /^documentation\/requirements\.txt$/ {f=1} END {exit !f}'; then
                continue
              fi
            fi
            digest=$(docker buildx imagetools inspect "${img}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            # Digest vazio apagaria a imagem do compose e derrubaria o servico.
            if ! echo "$digest" | grep -qxE 'sha256:[0-9a-f]{64}'; then
              echo "Digest invalido para ${img}: '${digest}'"; exit 1
            fi
            sed -i -E "s#(${img})@sha256:[0-9a-f]+#\1@${digest}#; s#(${img}):sha-[0-9a-f]+#\1:sha-${GITHUB_SHA}#" docker-compose.prod.yml
            # Linha que nao casou (imagem renomeada, dono novo) nao pode passar em verde.
            if ! grep -qF "${img}@${digest}" docker-compose.prod.yml; then
              echo "A linha image: de ${img} nao foi encontrada no compose"; exit 1
            fi
            mudou="$mudou $servico"
          done

          if git diff --quiet -- docker-compose.prod.yml; then
            echo "Nada a implantar: nenhum servico mudou desde o que esta em producao."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "deploy:$mudou no commit ${GITHUB_SHA:0:8}

          Para reverter esta implantacao: git revert deste commit." -- docker-compose.prod.yml
          # Merge que entrou entre o checkout e o push: rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            sleep 5; git pull -q --rebase origin main
          done
          echo "O push do commit de deploy falhou 3 vezes"; exit 1
