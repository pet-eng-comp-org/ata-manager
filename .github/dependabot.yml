# Padrão do PET para dependências (o mesmo em todos os repositórios):
# - semanal, às segundas;
# - minor e patch num PR por grupo; major sempre em PR próprio, para ser lido
#   e testado sozinho;
# - as correções de segurança vêm juntas num PR só.
# Mesclar um PR daqui passa pelo CI e, na branch principal, implanta.

version: 2

updates:
  # O Dockerfile instala por este arquivo.
  - package-ecosystem: pip
    directory: /documentation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      producao:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      seguranca:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
