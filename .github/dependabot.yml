# Padrão do PET para dependências (o mesmo em todos os repositórios):
# - semanal, às segundas;
# - minor e patch num PR por grupo; major sempre em PR próprio, para ser lido
#   e testado sozinho;
# - as correções de segurança vêm juntas num PR só.
# Mesclar um PR daqui passa pelo CI e, na branch principal, implanta.

version: 2

updates:
  # O Dockerfile instala por este arquivo.
  - package-ecosystem: pip
    directory: /documentation
    cooldown:
      # Versao nova so e proposta depois de 7 dias publicada: pacote
      # sequestrado costuma ser descoberto e retirado nesse prazo. Correcao
      # de seguranca nao espera (o cooldown nao vale para ela).
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      producao:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      seguranca:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      # Todas as actions num PR só, major inclusive: o CI do próprio PR testa o
      # workflow, e um PR por action enchia a lista (6 no site-pet de uma vez).
      actions:
        patterns: ["*"]
